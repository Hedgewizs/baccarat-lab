<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Baccarat Lab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3efe4;
        --surface: #fffdf6;
        --surface2: #ece5d3;
        --ink: #1d2620;
        --ink-soft: #4c5a50;
        --felt: #0d5c3f;
        --felt-deep: #083d29;
        --felt-panel: #0a4a32;
        --gold: #b8860b;
        --gold-bright: #c9a227;
        --line: #d8cfb6;
        --red: #b03030;
        --blue: #2456a6;
        --tie: #2e8b57;
        --chip: #ffffff;
        --shadow: 0 2px 10px rgba(30, 40, 30, .10);
        --btn-ink: #ffffff;
        --warn-bg: #fdf3d7;
        --warn-line: #d9b84a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d130f;
          --surface: #16211a;
          --surface2: #1d2c22;
          --ink: #ece7d7;
          --ink-soft: #a9b8ab;
          --felt: #127a52;
          --felt-deep: #07271a;
          --felt-panel: #0a3524;
          --gold: #d4af37;
          --gold-bright: #e3c65a;
          --line: #33453a;
          --red: #e0685f;
          --blue: #7aa2e8;
          --tie: #4cc38a;
          --chip: #1d2c22;
          --shadow: 0 2px 10px rgba(0, 0, 0, .45);
          --warn-bg: #2e2a16;
          --warn-line: #8a7422;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
        line-height: 1.55;
      }
      h1, h2, h3, .serif { font-family: Palatino, "Palatino Linotype", Georgia, "Songti TC", serif; }
      a { color: var(--felt); }
      @media (prefers-color-scheme: dark) { a { color: var(--gold-bright); } }

      /* ---------- header ---------- */
      header.site {
        position: sticky; top: 0; z-index: 50;
        background: linear-gradient(180deg, var(--felt-deep), var(--felt-panel));
        color: #f5efdb;
        border-bottom: 3px solid var(--gold-bright);
        box-shadow: var(--shadow);
      }
      .header-in {
        max-width: 1120px; margin: 0 auto; padding: 10px 16px 0;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
      }
      .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
      .brand .name { font-family: Palatino, Georgia, serif; font-size: 24px; font-weight: 700; letter-spacing: .5px; color: #fff8e1; white-space: nowrap; }
      @media (max-width: 560px) {
        .brand .name { font-size: 20px; }
        .brand .tag { display: none; }
      }
      .brand .name .lab { color: var(--gold-bright); }
      .brand .tag { font-size: 12px; color: #cfe3d2; }
      .lang-switch {
        display: flex; border: 1px solid var(--gold-bright); border-radius: 999px; overflow: hidden;
      }
      .lang-switch button {
        background: transparent; color: #f5efdb; border: 0; padding: 6px 14px;
        font-size: 13px; font-weight: 600; cursor: pointer;
      }
      .lang-switch button.on { background: var(--gold-bright); color: #231a00; }
      nav.main {
        max-width: 1120px; margin: 0 auto; padding: 8px 16px 10px;
        display: flex; flex-wrap: wrap; gap: 6px;
      }
      nav.main button {
        background: rgba(255,255,255,.08); color: #eef3e4; border: 1px solid rgba(255,255,255,.18);
        padding: 7px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
      }
      nav.main button.on { background: var(--gold-bright); color: #231a00; border-color: var(--gold-bright); font-weight: 700; }

      main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 40px; }
      .page { display: none; }
      .page.on { display: block; }

      /* ---------- hero / home ---------- */
      .hero {
        background:
          radial-gradient(ellipse at 50% -30%, rgba(255, 215, 120, .25), transparent 60%),
          linear-gradient(160deg, var(--felt) 0%, var(--felt-deep) 100%);
        color: #f7f2df; border-radius: 18px; padding: 34px 28px 30px;
        border: 1px solid var(--gold-bright);
        box-shadow: var(--shadow);
      }
      .hero h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 42px); color: #fff8e1; }
      .hero h1 .lab { color: var(--gold-bright); }
      .hero .sub { font-size: clamp(15px, 2.6vw, 19px); color: #dcead9; margin: 0 0 14px; }
      .hero p { max-width: 68ch; margin: 0 0 10px; color: #eef3e4; }
      .edge-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      .edge-strip .chipstat {
        background: rgba(0,0,0,.28); border: 1px solid rgba(255,215,120,.55);
        border-radius: 10px; padding: 8px 14px; font-size: 14px;
      }
      .edge-strip b { color: var(--gold-bright); font-size: 17px; }
      .honest {
        margin-top: 18px; background: var(--warn-bg); border: 1px solid var(--warn-line);
        color: var(--ink); border-radius: 12px; padding: 14px 16px; font-size: 15px;
      }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 20px; }
      .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
      }
      .card h3 { margin: 0; font-size: 20px; }
      .card p { margin: 0; color: var(--ink-soft); font-size: 15px; flex: 1; }
      .card button, .btn {
        background: var(--felt); color: var(--btn-ink); border: 0; border-radius: 9px;
        padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      .card button:hover, .btn:hover { filter: brightness(1.1); }
      .btn.gold { background: var(--gold-bright); color: #231a00; }
      .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .btn:disabled { opacity: .45; cursor: not-allowed; }
      .section-title { font-size: 26px; margin: 4px 0 4px; }
      .section-lede { color: var(--ink-soft); margin: 0 0 16px; max-width: 75ch; }

      /* ---------- tabs ---------- */
      .tabbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
      .tabbar button {
        background: var(--surface2); color: var(--ink); border: 1px solid var(--line);
        padding: 8px 13px; border-radius: 999px; font-size: 14px; cursor: pointer;
      }
      .tabbar button.on { background: var(--felt); color: #fff; border-color: var(--felt); font-weight: 700; }
      .tabpanel {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 22px; margin-top: 12px; box-shadow: var(--shadow);
      }
      .tabpanel h3 { margin: 0 0 8px; font-size: 22px; }
      .tabpanel h4 { margin: 18px 0 6px; font-size: 17px; }
      .tabpanel p { margin: 0 0 10px; max-width: 78ch; }
      .tabpanel ul, .tabpanel ol { margin: 0 0 12px; padding-left: 22px; max-width: 78ch; }
      .tabpanel li { margin-bottom: 5px; }
      .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
      .verdict {
        border: 1px solid var(--warn-line); background: var(--warn-bg);
        border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: 15px;
      }
      .verdict b.tag { color: var(--gold); }
      table.data { border-collapse: collapse; margin: 10px 0 16px; font-size: 14.5px; }
      table.data th, table.data td { border: 1px solid var(--line); padding: 6px 11px; text-align: left; }
      table.data th { background: var(--surface2); }
      table.data td.num, table.data th.num { text-align: right; }
      .plus { color: var(--tie); font-weight: 700; }
      .minus { color: var(--red); font-weight: 700; }
      .statgrid { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
      .statgrid .sg { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 13px; font-size: 14px; }
      .statgrid .sg b { font-size: 16px; }
      .sources { font-size: 14px; color: var(--ink-soft); }
      .sources li { margin-bottom: 4px; word-break: break-all; }

      /* ---------- simulator ---------- */
      .sim-grid { display: grid; grid-template-columns: 320px 1fr; gap: 14px; align-items: start; }
      @media (max-width: 860px) { .sim-grid { grid-template-columns: 1fr; } }
      .panel {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px;
      }
      .panel h3 { margin: 0 0 10px; font-size: 18px; }
      .field { margin-bottom: 11px; }
      .field label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
      .field select, .field input[type="number"], .field input[type="text"] {
        width: 100%; padding: 8px 10px; font-size: 15px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--chip); color: var(--ink);
      }
      .btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
      .btnrow .btn { flex: 1 1 auto; }
      .hand-display { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .hand-box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface2); }
      .hand-box.banker { border-top: 4px solid var(--red); }
      .hand-box.player { border-top: 4px solid var(--blue); }
      .hand-box h4 { margin: 0 0 6px; font-size: 15px; }
      .hand-box .total { font-size: 22px; font-weight: 700; }
      .pcards { display: flex; flex-wrap: wrap; gap: 5px; min-height: 40px; margin-bottom: 6px; }
      .pcard {
        background: var(--chip); border: 1px solid var(--line); border-radius: 6px;
        padding: 5px 7px; font-size: 15px; font-weight: 700; min-width: 34px; text-align: center;
        box-shadow: 0 1px 2px rgba(0,0,0,.12);
      }
      .pcard.redsuit { color: #c22f2f; }
      @media (prefers-color-scheme: dark) { .pcard.redsuit { color: #ff8a7a; } }
      .result-banner {
        border-radius: 10px; padding: 9px 13px; font-weight: 700; font-size: 16px; margin-top: 10px;
        background: var(--surface2); border: 1px solid var(--line);
      }
      .result-banner.B { background: rgba(176,48,48,.14); border-color: var(--red); }
      .result-banner.P { background: rgba(36,86,166,.14); border-color: var(--blue); }
      .result-banner.T { background: rgba(46,139,87,.15); border-color: var(--tie); }
      .stats-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
      .stats-table td { padding: 4px 2px; border-bottom: 1px dashed var(--line); }
      .stats-table td.v { text-align: right; font-weight: 700; }
      canvas.chart { width: 100%; height: 190px; display: block; }
      .roads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 700px) { .roads { grid-template-columns: 1fr; } }
      .road-box { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); }
      .road-box h4 { margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); }
      .road-scroll { overflow-x: auto; padding-bottom: 4px; }
      .road-grid { display: grid; gap: 2px; }
      .cell { width: 17px; height: 17px; border-radius: 50%; position: relative; flex: none; }
      .cell.b { border: 2px solid var(--red); }
      .cell.p { border: 2px solid var(--blue); }
      .cell.bead-b { background: var(--red); border: 2px solid var(--red); }
      .cell.bead-p { background: var(--blue); border: 2px solid var(--blue); }
      .cell.bead-t { background: var(--tie); border: 2px solid var(--tie); }
      .cell.mark-r { border: 2px solid var(--red); background: rgba(176,48,48,.35); }
      .cell.mark-b { border: 2px solid var(--blue); background: rgba(36,86,166,.35); }
      .cell.solid-r { background: var(--red); border: 2px solid var(--red); }
      .cell.solid-b { background: var(--blue); border: 2px solid var(--blue); }
      .cell .tie-n {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 10px; font-weight: 800; color: var(--tie);
        text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface);
      }
      .cell .pair-dot {
        position: absolute; width: 6px; height: 6px; border-radius: 50%;
      }
      .cell .pair-b { top: -2px; left: -2px; background: var(--red); }
      .cell .pair-p { bottom: -2px; right: -2px; background: var(--blue); }
      .cell.bead { color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
      .log {
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px;
        max-height: 150px; overflow-y: auto; background: var(--surface2);
        border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; white-space: pre-wrap;
      }
      .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
      .seg button { flex: 1; background: var(--chip); color: var(--ink); border: 0; padding: 8px 4px; font-size: 13.5px; cursor: pointer; }
      .seg button.on { background: var(--felt); color: #fff; font-weight: 700; }
      .count-big { font-size: 26px; font-weight: 800; }
      .signal-on { color: var(--tie); font-weight: 800; }
      .hidden-count { letter-spacing: 3px; color: var(--ink-soft); }
      footer.site {
        border-top: 3px solid var(--gold-bright); background: var(--felt-deep); color: #dfe9dc;
        margin-top: 10px;
      }
      .footer-in { max-width: 1120px; margin: 0 auto; padding: 20px 16px 26px; font-size: 14px; }
      .footer-in a { color: var(--gold-bright); }
      .footer-in .fine { color: #a9bfa9; font-size: 12.5px; margin-top: 8px; }
      .ad-slot {
        border: 1px dashed var(--line); border-radius: 12px; background: var(--surface2);
        color: var(--ink-soft); margin: 18px auto; padding: 16px; text-align: center;
        font-size: 12px; max-width: 1120px;
      }
      .ad-slot .ad-label { display: block; margin-bottom: 4px; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; }
      .ad-leaderboard { min-height: 100px; }
      .ad-inarticle { min-height: 260px; max-width: 728px; }
      .affil-note { font-size: 13px; color: var(--ink-soft); margin-top: 14px; }
      .about-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); max-width: 78ch; }
      .about-box p { margin: 0 0 10px; }
      .manual-bets { display: none; gap: 8px; margin-top: 8px; }
      .manual-bets.show { display: flex; }
      .manual-bets button { flex: 1; }
      .manual-bets button.on-b { background: var(--red); color: #fff; }
      .manual-bets button.on-p { background: var(--blue); color: #fff; }
    </style>
  </head>
  <body>
    <header class="site">
      <div class="header-in">
        <div class="brand">
          <span class="name">Baccarat <span class="lab">Lab</span></span>
          <span class="tag" data-i="tagline"></span>
        </div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button id="lang-en" class="on" type="button">EN</button>
          <button id="lang-zh" type="button">繁中</button>
        </div>
      </div>
      <nav class="main" id="mainnav"></nav>
    </header>

    <!-- Leaderboard ad slot (below nav) -->
    <div class="ad-slot ad-leaderboard">
      <span class="ad-label">Advertisement</span>
      <!-- Google AdSense: paste your ad unit code below this line -->
      <div class="ad-unit" data-ad-slot="leaderboard-top"></div>
    </div>

    <main>
      <!-- ================= HOME ================= -->
      <section class="page" id="page-home">
        <div class="hero">
          <h1>Baccarat <span class="lab">Lab</span></h1>
          <p class="sub" data-i="heroSub"></p>
          <p data-i="heroBody"></p>
          <div class="edge-strip">
            <span class="chipstat"><span data-i="edgeBanker"></span> <b>1.06%</b></span>
            <span class="chipstat"><span data-i="edgePlayer"></span> <b>1.24%</b></span>
            <span class="chipstat"><span data-i="edgeTie"></span> <b>14.36%</b></span>
          </div>
        </div>
        <div class="honest" data-i="honestLine"></div>
        <div class="cards">
          <div class="card">
            <h3 data-i="cardGuideT"></h3>
            <p data-i="cardGuideB"></p>
            <button type="button" data-goto="guide" data-i="cardGuideBtn"></button>
          </div>
          <div class="card">
            <h3 data-i="cardSideT"></h3>
            <p data-i="cardSideB"></p>
            <button type="button" data-goto="sidebets" data-i="cardSideBtn"></button>
          </div>
          <div class="card">
            <h3 data-i="cardSimT"></h3>
            <p data-i="cardSimB"></p>
            <button type="button" data-goto="sim" data-i="cardSimBtn"></button>
          </div>
        </div>
      </section>

      <!-- ================= STRATEGY GUIDE ================= -->
      <section class="page" id="page-guide">
        <h2 class="section-title" data-i="guideTitle"></h2>
        <p class="section-lede" data-i="guideLede"></p>
        <div class="tabbar" id="guide-tabs"></div>
        <div class="tabpanel" id="guide-panel"></div>
      </section>

      <!-- ================= SIDE BETS ================= -->
      <section class="page" id="page-sidebets">
        <h2 class="section-title" data-i="sideTitle"></h2>
        <p class="section-lede" data-i="sideLede"></p>
        <div class="tabbar" id="side-tabs"></div>
        <div class="tabpanel" id="side-panel"></div>
      </section>

      <!-- ================= SIMULATOR ================= -->
      <section class="page" id="page-sim">
        <h2 class="section-title" data-i="simTitle"></h2>
        <p class="section-lede" data-i="simLede"></p>
        <div class="honest" style="margin:0 0 14px" data-i="simNote"></div>
        <div class="sim-grid">
          <div>
            <div class="panel">
              <h3 data-i="controlsT"></h3>
              <div class="field">
                <label for="sel-method" data-i="fMethod"></label>
                <select id="sel-method">
                  <option value="manual" data-i="mManual"></option>
                  <option value="follow" data-i="mFollow"></option>
                  <option value="threebead" data-i="mThree"></option>
                  <option value="bothdir" data-i="mBoth"></option>
                  <option value="virtual" data-i="mVirtual"></option>
                  <option value="banker" data-i="mBanker"></option>
                </select>
                <div class="manual-bets" id="manual-bets">
                  <button type="button" class="btn ghost" id="mb-b"></button>
                  <button type="button" class="btn ghost" id="mb-p"></button>
                </div>
              </div>
              <div class="field">
                <label for="sel-prog" data-i="fProg"></label>
                <select id="sel-prog">
                  <option value="flat" data-i="pFlat"></option>
                  <option value="martingale" data-i="pMart"></option>
                  <option value="ladder137" data-i="p137"></option>
                  <option value="paroli" data-i="pParoli"></option>
                  <option value="fibonacci" data-i="pFib"></option>
                  <option value="staircase" data-i="pStair"></option>
                </select>
              </div>
              <div class="field">
                <label for="in-bankroll" data-i="fBankroll"></label>
                <input type="number" id="in-bankroll" value="10000" min="100" step="100" />
              </div>
              <div class="field">
                <label for="in-unit" data-i="fUnit"></label>
                <input type="number" id="in-unit" value="100" min="1" step="1" />
              </div>
              <div class="field">
                <label for="sel-speed" data-i="fSpeed"></label>
                <select id="sel-speed">
                  <option value="900" data-i="sSlow"></option>
                  <option value="350" selected data-i="sMed"></option>
                  <option value="90" data-i="sFast"></option>
                </select>
              </div>
              <div class="btnrow">
                <button type="button" class="btn gold" id="btn-deal"></button>
                <button type="button" class="btn" id="btn-play"></button>
              </div>
              <div class="btnrow" style="margin-top:8px">
                <button type="button" class="btn ghost" id="btn-newshoe"></button>
                <button type="button" class="btn ghost" id="btn-reset"></button>
              </div>
            </div>

            <div class="panel">
              <h3 data-i="batchT"></h3>
              <div class="field">
                <label for="in-batch" data-i="fBatch"></label>
                <input type="number" id="in-batch" value="200" min="10" max="5000" step="10" />
              </div>
              <div class="btnrow">
                <button type="button" class="btn" id="btn-batch"></button>
              </div>
              <div id="batch-out" style="margin-top:10px; font-size:14px"></div>
              <canvas class="chart" id="batch-chart" height="190" style="display:none"></canvas>
            </div>

            <div class="panel">
              <h3 data-i="d7T"></h3>
              <div class="field">
                <label data-i="fD7Mode"></label>
                <div class="seg" id="d7-seg">
                  <button type="button" data-d7="off" class="on" data-i="d7Off"></button>
                  <button type="button" data-d7="learn" data-i="d7Learn"></button>
                  <button type="button" data-d7="practice" data-i="d7Practice"></button>
                </div>
              </div>
              <div id="d7-body" style="display:none">
                <div style="display:flex; gap:18px; flex-wrap:wrap; align-items:baseline">
                  <div><div style="font-size:12px; color:var(--ink-soft)" data-i="d7RC"></div><div class="count-big" id="d7-rc">0</div></div>
                  <div><div style="font-size:12px; color:var(--ink-soft)" data-i="d7TC"></div><div class="count-big" id="d7-tc">0.0</div></div>
                  <div><div style="font-size:12px; color:var(--ink-soft)" data-i="d7Decks"></div><div class="count-big" id="d7-decks">8.0</div></div>
                </div>

        {
          id: "threebead", title: { en: "Three-Bead Road Counter-Bet", zh: "三珠路反打一口" },
          en: `<div class="kicker">Bet selection</div><h3>Three-Bead Road Counter-Bet （三珠路反打一口）</h3>
          <p>The bead plate records every result in order. The <b>three-bead road</b> simply groups that stream into consecutive triplets — three results at a time — and reads each triplet as a pattern. There are only eight possible triplets, and players sort them into four families:</p>
          <table class="data"><tr><th>Triplet</th><th>Family</th><th>Shape</th></tr>
          <tr><td>BBB · PPP</td><td>Streak （連式）</td><td>Three the same</td></tr>
          <tr><td>BPB · PBP</td><td>Chop （跳式）</td><td>Alternating</td></tr>
          <tr><td>BBP · PPB</td><td>Formal （正式）</td><td>Pair, then a switch</td></tr>
          <tr><td>BPP · PBB</td><td>Reverse （反式）</td><td>One, then a pair</td></tr></table>
          <p>Every triplet implies a "next" result — the result that would continue its pattern (a streak implies more of the same, a chop implies another switch, and so on). The counter-bet play, <b>反打一口</b>, does the opposite of what intuition suggests:</p>
          <ol>
          <li>Wait for a triplet to complete.</li>
          <li>Work out which result the triplet's pattern implies next.</li>
          <li>Bet <b>against</b> that implied result — for exactly <b>one hand</b> （一口 = one mouthful, one bet).</li>
          <li>Win or lose, stop. The hand you just played becomes the first bead of the next triplet, and the process restarts.</li>
          </ol>
          <p>The method is designed for "bad roads" （爛路） — choppy shoes with no readable trend, where following patterns keeps getting chopped up. Betting against the pattern's implication for a single hand is a way of fading the crowd's most obvious read.</p>
          <div class="verdict"><b class="tag">Honest verdict:</b> the counter-bet is a discipline device, not an edge. Each hand is independent — the triplet has no memory and no influence on the next cards. What the method genuinely does is limit you to one considered bet per three results, which slows your exposure per shoe. Pair it with the 137 ladder (see the Signature Play tab) and the stakes — not the selection — become the real story.</div>`,
          zh: `<div class="kicker">選注法</div><h3>三珠路反打一口</h3>
          <p>珠盤路會依序記錄每一局的結果。<b>三珠路</b>就是把這串結果每三個一組來分組，把每一組三連珠看成一個路型。三連珠只有八種可能，玩家把它們歸成四類：</p>
          <table class="data"><tr><th>三連珠</th><th>類別</th><th>形狀</th></tr>
          <tr><td>莊莊莊 · 閒閒閒</td><td>連式</td><td>三個相同</td></tr>
          <tr><td>莊閒莊 · 閒莊閒</td><td>跳式</td><td>交替單跳</td></tr>
          <tr><td>莊莊閒 · 閒閒莊</td><td>正式</td><td>先一對、再轉向</td></tr>
          <tr><td>莊閒閒 · 閒莊莊</td><td>反式</td><td>先一個、再成對</td></tr></table>
          <p>每一組三連珠都「暗示」著下一個結果——能延續其路型的那個結果（連式暗示繼續連、跳式暗示繼續跳，依此類推）。而反打一口的做法恰恰與直覺相反：</p>
          <ol>
          <li>等一組三連珠完成。</li>
          <li>判斷該路型暗示的下一個結果是什麼。</li>
          <li>下注押<b>相反</b>的那一邊——只押<b>一口</b>（一局）。</li>
          <li>無論輸贏都停手。剛打完的這一局成為下一組三連珠的第一顆珠，重新開始。</li>
          </ol>
          <p>這個方法專門為「爛路」設計——沒有明顯趨勢、追路型會一直被切斷的牌靴。押路型暗示的反面一口，等於是逆著最顯而易見的讀路方向下注。</p>
          <div class="verdict"><b class="tag">誠實評價：</b>反打一口是紀律工具，不是優勢。每一局都是獨立的——三連珠沒有記憶，也影響不了下一張牌。它真正的作用是讓你每三個結果才下一次經過思考的注，從而降低每靴的曝險速度。若搭配 137 纜法（見「招牌打法」分頁），真正的主角是注碼，而不是選注。</div>`

          id: "follow", title: { en: "Follow the Winner", zh: "莊閒跟打" },
          en: `<div class="kicker">Bet selection</div><h3>Follow the Winner （莊閒跟打）</h3>
          <p>The simplest selection method in the game: <b>bet on whichever side won the last hand</b>. Banker won? Bet Banker. Player won? Bet Player. On a tie, keep the same bet as the previous hand.</p>
          <table class="data"><tr><th>Last result</th><th>Your next bet</th></tr>
          <tr><td>Banker</td><td>Banker</td></tr>
          <tr><td>Player</td><td>Player</td></tr>
          <tr><td>Tie</td><td>Same as your previous bet</td></tr></table>
          <p>Why players like it: it needs no scoreboard reading, it automatically rides streaks (long Banker or Player runs — the famous "dragons"), and it never fights the shoe. In the simulator it is the baseline the fancier methods are measured against, and it doubles as the base method for the both-directions play on the next tab.</p>
          <div class="verdict"><b class="tag">Honest verdict:</b> following the winner wins exactly as often as the shoe's natural Banker/Player split allows — past results don't change the next hand's odds. Its real benefit is behavioral: it removes indecision. You'll ride every streak and also buy the top of every streak, one hand late, every time.</div>`,
          zh: `<div class="kicker">選注法</div><h3>莊閒跟打（跟贏家）</h3>
          <p>全場最簡單的選注法：<b>上一局哪邊贏，就押哪邊</b>。莊贏就押莊，閒贏就押閒；若開和，維持上一局的注不變。</p>

          <tr><td>和</td><td>與上一注相同</td></tr></table>
          <p>玩家喜歡它的原因：不用讀路、自動跟上連贏的長龍（莊龍、閒龍），而且永遠不跟牌靴作對。在模擬器裡，它是其他進階方法的比較基準，也是下一個分頁「正反打」的基礎方法。</p>
          <div class="verdict"><b class="tag">誠實評價：</b>跟打的勝率就是牌靴本身莊閒比例決定的勝率——過去的結果不會改變下一局的機率。它真正的好處是行為面的：消除猶豫。你會跟上每一次連贏，也會在每次連贏的頂點晚一局買進，次次如此。</div>`

          id: "bothdir", title: { en: "One Method, Both Directions", zh: "單一方法正反打" },
          en: `<div class="kicker">Bet selection</div><h3>Single Method, Both Directions, Flat Stakes （正反打 + 平注）</h3>
          <p>A deliberately calmer style of play built on three rules:</p>
          <ol>
          <li><b>Pick one</b> selection method (follow-the-winner is the usual choice) and commit to it for the whole shoe — no switching mid-shoe.</li>
          <li>Run it in <b>both directions</b>: one track bets the method's pick （正打）, a parallel track bets the exact opposite （反打）.</li>
          <li><b>Flat stakes only.</b> Every bet is one base unit. No progressions, no chasing, ever.</li>
          </ol>
          <p>The two tracks mostly cancel each other out; what remains is the slow drag of the Banker commission asymmetry and the house edge on the total action. Players use it as a low-drama way to stay at the table, generate play for comps, and remove every in-the-moment decision.</p>
          <p>In the simulator, this mode runs both tracks on the same shoe and combines their results into one bankroll, so you can watch the cancellation happen in real numbers.</p>

          id: "virtual", title: { en: "The Virtual Player", zh: "虛擬玩家" },
          en: `<div class="kicker">Bet selection · discipline</div><h3>The Virtual Player （虛擬玩家）</h3>
          <p>The Virtual Player is a <b>rule-based imaginary bettor</b> whose play you simulate alongside the real shoe. The classic configuration is deliberately boring: the virtual player flat-bets the same simple rule every hand — no reversing direction, no progressions, no hunches.</p>
          <h4>How the signal works</h4>
          <ol>
          <li>Define the virtual player's fixed rule in advance (for example: always flat-bet Banker).</li>
          <li>Track its hypothetical results hand by hand, as if it were betting real money.</li>
          <li>Only place <b>your</b> real bets when the virtual player is performing well — when its recent simulated record says your shared rule is "in tune" with this shoe. A common trigger is a voting tally: the virtual player's wins versus losses over a rolling window; bet only when the tally is clearly positive.</li>
          <li>When the virtual player's record turns cold, sit out. No real money rides while the signal is off.</li>
          </ol>
          <p>In the simulator, Virtual Player mode tracks a bot that flat-bets Banker every hand. Your real bets switch on only while the bot has won at least 6 of its last 10 virtual bets, and they follow Banker with whatever progression you've selected.</p>
          <div class="verdict"><b class="tag">Honest verdict:</b> the Virtual Player cannot manufacture an edge — a bot's past simulated results say nothing about the next independent hand. Its genuine value is psychological: it gives loss-chasing emotions a referee. Many players find "the signal is off" far easier to obey than "I should stop," and any structure that stops you betting every hand reduces the edge's total bite per hour.</div>`,
          zh: `<div class="kicker">選注法 · 紀律</div><h3>虛擬玩家</h3>
          <p>虛擬玩家是一個<b>依照固定規則下注的想像玩家</b>，你讓它跟著真實牌靴同步「模擬下注」。經典設定刻意無聊：虛擬玩家每一局都用同一個簡單規則平注——不反向、不用纜法、不憑感覺。</p>

          en: `<div class="kicker">Progression</div><h3>Martingale — the Straight Cable （直纜）</h3>
          <p>The oldest loss-chase in the book. The rule fits in one line: <b>after every loss, double your bet; after a win, reset to one base unit.</b> On a tie, hold the current stake.</p>
          <table class="data"><tr><th>Consecutive losses</th><th class="num">Next bet (units)</th><th class="num">Total lost so far</th></tr>
          <tr><td>0</td><td class="num">1</td><td class="num">0</td></tr>

          <tr><td>6</td><td class="num">64</td><td class="num">63</td></tr>
          <tr><td>7</td><td class="num">128</td><td class="num">127</td></tr></table>
          <p>Any win recovers all previous losses plus one unit of profit (slightly less on Banker, after the 5% commission). That's the seduction: the system "works" almost every session — until a losing streak of 7–8 hands, which is a matter of when, not if, meets a table limit or an empty bankroll and the entire accumulated profit plus 127+ units disappears in one sequence.</p>
          <div class="verdict"><b class="tag">Honest verdict:</b> Martingale converts many small wins into rare catastrophic losses at exactly unchanged expected value. Run it in the simulator at fast speed and watch the bankroll chart: a staircase up, then a cliff. The cliff always arrives.</div>`,
          zh: `<div class="kicker">纜法</div><h3>直纜（馬丁格爾）</h3>

          id: "ladder137", title: { en: "The 137 Ladder", zh: "137 六層纜法" },
          en: `<div class="kicker">Progression</div><h3>The 137 Six-Level Ladder （137 六層纜法）</h3>
          <p>A six-level negative progression — a loss-chase with a gentler slope than Martingale. The levels scale in a 1-3-7 pattern, each step roughly doubling the previous one and adding a unit:</p>
          <table class="data"><tr><th>Level</th><th class="num">Bet (units)</th><th class="num">Cumulative if all 6 lose</th></tr>
          <tr><td>1</td><td class="num">1</td><td class="num">1</td></tr>
          <tr><td>2</td><td class="num">3</td><td class="num">4</td></tr>
          <tr><td>3</td><td class="num">7</td><td class="num">11</td></tr>
          <tr><td>4</td><td class="num">15</td><td class="num">26</td></tr>
          <tr><td>5</td><td class="num">31</td><td class="num">57</td></tr>
          <tr><td>6</td><td class="num">63</td><td class="num">126</td></tr></table>
          <h4>Rules</h4>
          <ul>
          <li>Start at level 1. <b>Every loss climbs one level; any win returns you to level 1.</b> Ties hold the level.</li>
          <li>A win at any level recovers most or all of the sequence's losses and locks a small profit (exact recovery varies with Banker commission).</li>
          <li><b>Ladder bust:</b> if all six levels lose in a row, the sequence costs 126 units. You accept it and stop the sequence — this is the built-in catastrophe that the frequent small wins are priced against.</li>
          </ul>
          <p>Compared with Martingale, the 137 ladder risks a similar total (126 vs 127 units) but spreads it over six decisions instead of seven doublings, and mid-ladder wins recover the sequence earlier. It is the staking half of the signature play on the next tab.</p>
          <div class="verdict"><b class="tag">Honest verdict:</b> gentler slope, same destination. Six consecutive losses happen far more often than intuition says — across a few hundred hands, expect to meet them. The ladder trades win-frequency for tail risk, exactly like every loss-chase: the fatal flaw is that the recovery plan assumes a win arrives before the ladder ends, and probability makes no such promise.</div>`,
          zh: `<div class="kicker">纜法</div><h3>137 六層纜法</h3>

          en: `<div class="kicker">Step by step</div><h3>The Signature Play: Three-Bead Counter-Bet + 137 Ladder</h3>
          <p>This combines the two systems from the earlier tabs into one complete method: the three-bead road decides <i>when and where</i> to bet; the 137 ladder decides <i>how much</i>. Follow it mechanically:</p>
          <ol>
          <li><b>Set up.</b> Choose a base unit your bankroll can survive losing 126 of. Record every result on the bead plate from the start of the shoe.</li>
          <li><b>Build the triplet.</b> Group results into consecutive triplets (ignore ties for grouping — they don't form beads in this road).</li>
          <li><b>Read the pattern.</b> When a triplet completes, classify it (streak / chop / formal / reverse) and name the result its pattern implies next.</li>
          <li><b>Counter-bet one hand.</b> Bet the <i>opposite</i> of the implied result, at your current ladder level. This is the only bet the triplet produces.</li>
          <li><b>Move the ladder.</b> Win → back to level 1 (1 unit). Lose → climb one level. Tie → level unchanged, and the hand doesn't count as your counter-bet result for the triplet — wait for the next completed triplet.</li>

          <li><b>Respect the bust.</b> If you lose at level 6, the sequence is over and 126 units are gone. Do not start a second ladder to "win it back" — that converts a defined loss into an open-ended one.</li>

          <p>Shoe opens B, B, P — a "formal" triplet. Its pattern implies Banker next (a switch back after the pair), so you counter-bet <b>Player</b>, 1 unit. Player wins → profit 1 unit, ladder resets, and that Player result opens the next triplet. Two hands later the triplet completes P, P, B (another "formal"); its pattern implies Player next, so you counter-bet <b>Banker</b>. Banker wins with commission → +0.95 units. And so on — one decision, one bet, every three results.</p>

          zh: `<div class="kicker">步驟教學</div><h3>招牌打法：三珠路反打一口 + 137 纜法</h3>
          <p>這套打法把前面兩個分頁的系統合成一個完整方法：三珠路決定「何時押、押哪邊」；137 纜法決定「押多少」。請機械化地照步驟執行：</p>

          <p>Paroli is Martingale turned upside down: a <b>positive</b> progression that presses wins instead of chasing losses.</p>

          zh: `<div class="kicker">纜法</div><h3>五注斐氏勝追纜（黃金分割）</h3>

          en: `<div class="kicker">Progression</div><h3>The Staircase （樓梯纜）</h3>
          <p>The mildest of the loss-chases. Your stake is a step number, starting at 1 unit:</p>

          en: `<div class="kicker">Read this tab twice</div><h3>The Honest Verdicts</h3>
          <p>Everything on this page is worth understanding — and none of it should be oversold. Three verdicts matter most:</p>
          <h4>1. Progression profits are real short-term — and not replicable long-term</h4>
          <p>Loss-chasing ladders genuinely do produce winning sessions most of the time; that's arithmetic, not marketing. But the same arithmetic guarantees the bust that erases them, and across enough shoes the busts always collect what they're owed. A system that wins 9 sessions out of 10 and loses 11 sessions' profit in the 10th is not a profit system — it's a loan from probability.</p>
          <h4>2. Every loss-chase has the same fatal flaw</h4>
          <p>The recovery plan assumes a win arrives before the ladder, the table limit, or your bankroll runs out. Nothing enforces that assumption. The flaw isn't bad luck — it's structural: you're betting the largest amounts precisely when you've been losing, with money that matters most, on hands whose odds never changed.</p>
          <h4>3. Betting fewer hands is not safer</h4>
          <p>Playing selectively <i>feels</i> lower-risk, and per hour it does reduce your expected loss (less action × same edge). But per hand, nothing improves — and selective systems that "wait for the right spot" often concentrate the same total risk into fewer, larger, progression-inflated bets. Fewer hands at bigger stakes can be riskier than more hands at small stakes, even with identical expected loss.</p>

          <table class="data"><tr><th>Bet</th><th class="num">House edge</th></tr>

          <tr><td>Player</td><td class="num">1.24%</td></tr>
          <tr><td>Tie (8:1)</td><td class="num">14.36%</td></tr></table>
          <p>No selection method, progression, road-reading, or virtual signal changes these figures by a single basis point. What systems <i>can</i> legitimately do: structure your session, pace your action, cap your decisions, and make the entertainment budget last. Used that way — with eyes open — they're tools. Sold as income, they're a story.</p>`,
          zh: `<div class="kicker">這一頁請看兩次</div><h3>誠實結論</h3>
          <p>這一頁的每個系統都值得理解——但沒有一個應該被過度吹捧。最重要的三個結論：</p>
          <h4>1. 纜法的短期獲利是真的——但長期無法複製</h4>
          <p>負追纜法確實在大多數場次會贏，這是算術，不是行銷話術。但同一套算術也保證了那次會把獲利全數抹掉的斷纜；而打得夠多靴，斷纜總會來收它應得的。一個 10 場贏 9 場、卻在第 10 場輸掉 11 場利潤的系統，不是獲利系統——那是向機率借的貸款。</p>

          <p>追回計畫假設在纜斷、桌限或資金耗盡之前，一定會贏一局。沒有任何力量保證這個假設成立。這個缺陷不是運氣不好，而是結構性的：你正是在連敗的時候、用最輸不起的錢、下最大的注，而每一局的機率從未改變。</p>

          <p>選擇性下注「感覺」風險較低，以每小時計算，預期虧損確實會減少（總投注額 × 相同優勢）。但以每局計算，什麼都沒改善——而且「等對的時機」的選擇性系統，常把相同的總風險集中到更少、更大、被纜法膨脹的注上。少數幾注大注，可能比多注小注更危險，即使預期虧損相同。</p>

        var pad = 8, span = max - min;
        function X(k) { return pad + (W - pad * 2) * (data.length === 1 ? 0 : k / (data.length - 1)); }
        function Y(v) { return 6 + (H - 22) * (1 - (v - min) / span); }
        g.strokeStyle = cssVar("--gold"); g.setLineDash([4, 4]);
        g.beginPath(); g.moveTo(pad, Y(S.start)); g.lineTo(W - pad, Y(S.start)); g.stroke(); g.setLineDash([]);
        g.strokeStyle = cssVar("--felt"); g.lineWidth = 2; g.beginPath();
        for (i = 0; i < data.length; i++) { if (i === 0) g.moveTo(X(i), Y(data[i])); else g.lineTo(X(i), Y(data[i])); }
        g.stroke(); g.lineWidth = 1;
        g.fillStyle = cssVar("--ink-soft"); g.font = "11px sans-serif";
        g.fillText(fmt$(max), pad, 12);
        g.fillText(fmt$(min), pad, H - 4);
      }

      /* ---------- rendering ---------- */
      var SUITS = ["♠", "♥", "♦", "♣"], RANKS = { 1: "A", 11: "J", 12: "Q", 13: "K" };
      function cardHTML(c) {
        var lbl = RANKS[c.r] || String(c.r), red = c.s === 1 || c.s === 2;
        return '<span class="pcard' + (red ? " redsuit" : "") + '">' + lbl + SUITS[c.s] + "</span>";
      }
      function renderHand() {
        if (!lastHand) { $("p-cards").innerHTML = ""; $("b-cards").innerHTML = ""; $("p-total").textContent = "–"; $("b-total").textContent = "–"; $("result-banner").textContent = "—"; $("result-banner").className = "result-banner"; return; }
        $("p-cards").innerHTML = lastHand.pc.map(cardHTML).join("");
        $("b-cards").innerHTML = lastHand.bc.map(cardHTML).join("");
        $("p-total").textContent = lastHand.pv + (lastHand.pc.length === 2 && lastHand.pv >= 8 ? " · " + t("nat") : "");
        $("b-total").textContent = lastHand.bv + (lastHand.bc.length === 2 && lastHand.bv >= 8 ? " · " + t("nat") : "");
        var rb = $("result-banner");
        rb.className = "result-banner " + lastHand.res;
        rb.textContent = (lastHand.res === "B" ? t("resB") : lastHand.res === "P" ? t("resP") : t("resT")) + (lastHand.dragon ? " — Dragon 7!" : "") + (lastHand.panda ? " — Panda 8!" : "");
      }
      function roadGridHTML(road, clsFn, metaFn) {
        var html = "", key, pos;
        for (key in road.cells) {
          pos = key.split(",");
          html += '<div class="cell ' + clsFn(road.cells[key]) + '" style="grid-column:' + (parseInt(pos[0], 10) + 1) + ";grid-row:" + (parseInt(pos[1], 10) + 1) + '">' + (metaFn ? metaFn(key) : "") + "</div>";
        }
        var el = document.createElement("div");
        return { html: html, cols: road.maxX + 1 };
      }
      function setRoad(elId, road, clsFn, metaFn) {
        var el = $(elId), r = roadGridHTML(road, clsFn, metaFn);
        el.style.gridTemplateColumns = "repeat(" + Math.max(1, r.cols) + ", 17px)";
        el.style.gridTemplateRows = "repeat(6, 17px)";
        el.innerHTML = r.html;
        var sc = el.parentElement; sc.scrollLeft = sc.scrollWidth;
      }
      function renderRoads() {
        if (!roads) return;
        var beadEl = $("road-bead"), cols = Math.max(1, Math.ceil(beadResults.length / 6)), html = "", i, h;
        beadEl.style.gridTemplateColumns = "repeat(" + cols + ", 17px)";
        beadEl.style.gridTemplateRows = "repeat(6, 17px)";
        for (i = 0; i < beadResults.length; i++) {
          h = beadResults[i];
          var cls = h.res === "B" ? "bead-b" : h.res === "P" ? "bead-p" : "bead-t";
          var ch = LANG === "zh" ? (h.res === "B" ? "莊" : h.res === "P" ? "閒" : "和") : h.res;
          var dots = (h.bPair ? '<span class="pair-dot pair-b"></span>' : "") + (h.pPair ? '<span class="pair-dot pair-p"></span>' : "");
          html += '<div class="cell bead ' + cls + '" style="grid-column:' + (Math.floor(i / 6) + 1) + ";grid-row:" + (i % 6 + 1) + '">' + ch + dots + "</div>";
        }
        beadEl.innerHTML = html;
        var bsc = beadEl.parentElement; bsc.scrollLeft = bsc.scrollWidth;
        var bigMeta = {};
        setRoad("road-big", roads.big, function (c) { return c === "B" ? "b" : "p"; }, function (key) {
          var out = "";
          if (tieMarks[key]) out += '<span class="tie-n">' + tieMarks[key] + "</span>";
          return out;
        });
        // pair dots on big road: rebuild from stored positions is complex; dots live on bead plate instead.
        setRoad("road-eye", roads.eye, function (c) { return c === "R" ? "mark-r" : "mark-b"; }, null);
        setRoad("road-small", roads.small, function (c) { return c === "R" ? "mark-r" : "mark-b"; }, null);
        setRoad("road-cock", roads.cock, function (c) { return c === "R" ? "solid-r" : "solid-b"; }, null);
      }
      function nextBetText() {
        var st = settings(), parts = [], i, side, amt;
        for (i = 0; i < tracks.length; i++) {
          side = trackPick(tracks[i], ctx, false);
          if (side) { amt = progUnits(st.prog, tracks[i].st) * st.unit; parts.push(sideName(side) + " " + fmt$(amt)); }
        }
        if (settings().method === "virtual") {
          var sig = vpPick(ctx);
          parts.push(t("vpSignal") + ": " + (sig ? t("vpOn") : t("vpOff")));
        }
        return parts.length ? parts.join(" · ") : "—";
      }
      function renderStats() {
        if (!S) return;
        $("st-shoe").textContent = shoeNo;
        $("st-cards").textContent = shoeArr.length - shoeIdx;
        $("st-nextbet").textContent = S.busted ? "—" : nextBetText();
        $("st-bankroll").textContent = fmt$(S.bankroll);
        var pl = S.bankroll - S.start;
        $("st-pl").textContent = (pl > 0 ? "+" : "") + fmt$(pl);
        $("st-pl").style.color = pl > 0 ? "var(--tie)" : pl < 0 ? "var(--red)" : "";
        $("st-hands").textContent = S.hands;
        $("st-wl").textContent = S.wins + " / " + S.losses + " / " + S.ties;
        $("st-peak").textContent = fmt$(S.peak);
        $("st-dd").textContent = fmt$(S.maxDD);
        $("st-largest").textContent = fmt$(S.largest);
      }
      function renderD7() {
        var on = d7Mode !== "off";
        $("d7-body").style.display = on ? "block" : "none";
        Array.prototype.forEach.call($("d7-seg").children, function (b) { b.classList.toggle("on", b.getAttribute("data-d7") === d7Mode); });
        $("d7-practice").style.display = d7Mode === "practice" ? "block" : "none";
        if (!on) return;
        var decksLeft = Math.max(0.1, (shoeArr.length - shoeIdx) / 52);
        var tc = d7RC / decksLeft;
        var hide = d7Mode === "practice" && !d7Revealed;
        $("d7-rc").innerHTML = hide ? '<span class="hidden-count">•••</span>' : String(d7RC);
        $("d7-tc").innerHTML = hide ? '<span class="hidden-count">•••</span>' : tc.toFixed(1);
        $("d7-decks").textContent = decksLeft.toFixed(1);
        var sig = $("d7-signal");
        if (hide) sig.innerHTML = "";
        else if (tc >= 4) sig.innerHTML = '<span class="signal-on">' + t("d7Bet") + "</span>";
        else sig.textContent = t("d7NoBet");
      }
      function renderAll() { renderHand(); renderStats(); renderRoads(); renderD7(); drawBrChart(); }

      /* ---------- controls wiring ---------- */
      function stopPlay() { playing = false; if (timer) { clearInterval(timer); timer = null; } $("btn-play").textContent = t("play"); }
      $("btn-play").addEventListener("click", function () {
        if (playing) { stopPlay(); return; }
        if (!S || S.busted) return;
        playing = true; $("btn-play").textContent = t("pause");
        timer = setInterval(step, settings().speed);
      });
      $("sel-speed").addEventListener("change", function () { if (playing) { clearInterval(timer); timer = setInterval(step, settings().speed); } });
      $("btn-deal").addEventListener("click", function () { stopPlay(); step(); });
      $("btn-newshoe").addEventListener("click", function () { stopPlay(); newShoeState(); logLine(t("logShoe") + shoeNo + " —"); renderAll(); });
      $("btn-reset").addEventListener("click", resetSession);
      $("btn-batch").addEventListener("click", runBatch);
      $("sel-method").addEventListener("change", function () {
        tracks = makeTracks(settings().method);
        $("manual-bets").classList.toggle("show", settings().method === "manual");
        renderStats();
      });
      $("sel-prog").addEventListener("change", function () { tracks = makeTracks(settings().method); renderStats(); });
      function syncManualBtns() { $("mb-b").className = "btn " + (manualSide === "B" ? "on-b" : "ghost"); $("mb-p").className = "btn " + (manualSide === "P" ? "on-p" : "ghost"); }
      $("mb-b").addEventListener("click", function () { manualSide = "B"; syncManualBtns(); renderStats(); });
      $("mb-p").addEventListener("click", function () { manualSide = "P"; syncManualBtns(); renderStats(); });
      Array.prototype.forEach.call($("d7-seg").children, function (b) {
        b.addEventListener("click", function () { d7Mode = b.getAttribute("data-d7"); $("guess-out").textContent = ""; renderD7(); });
      });
      $("btn-reveal").addEventListener("click", function () { d7Revealed = true; renderD7(); });
      $("btn-guess").addEventListener("click", function () {
        var v = parseInt($("in-guess").value, 10);
        if (isNaN(v)) { $("guess-out").textContent = t("guessEmpty"); return; }
        $("guess-out").textContent = (v === d7RC ? t("guessRight") : t("guessWrong")) + d7RC + ".";
      });
      window.addEventListener("resize", function () { drawBrChart(); });

      /* ---------- init ---------- */
      syncManualBtns();
      resetSession();
      applyLang();
      showPage("home");
    </script>
  </body>
</html>
